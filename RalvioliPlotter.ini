; Sets the default configuration values read by the application.
[Plotter]
; WinUSB uses the Windows driver. Set Backend=libusbK for the legacy backend.
Backend=WinUSB
; Paper calibration factors as feed|across. The Calibrate dialog updates these.
Calibration=1|1
; USB ids of the plotter (hex), from the old Algotex-Printer.inf
Vid=135D
Pid=F001
; Pipe=-1 picks the first bulk OUT endpoint; set e.g. Pipe=2 to force endpoint 0x02
Pipe=-1
Chunk=4096
TimeoutMs=2000
; Test without a plotter: write the exact bytes to a file instead of sending them over USB
; DryRun=C:\Temp\dryrun.plt
