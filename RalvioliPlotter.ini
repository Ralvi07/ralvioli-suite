; Sets the default configuration values read by the application.
[Plotter]
; WinUSB uses the Windows driver. Use Backend=libusbK with the legacy driver and a matching DLL.
Backend=WinUSB
; Calibration factors in feed|across order.
Calibration=1|1
Vid=135D
Pid=F001
; Legacy command endpoints, expressed in decimal. -1 selects the first bulk pipe of that direction.
Pipe=1
PipeIn=129
TimeoutMs=2000
; Diagnostic raster export. Relative paths resolve against this INI.
RasterOutput=.
; Preview defaults. The VEGA head resolution and line encoding still need verification.
Dpi=300
LineWidthMm=0.4
