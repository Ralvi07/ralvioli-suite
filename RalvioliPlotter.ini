; Sets the default configuration values read by the application.
[Plotter]
; Direct VEGA printing uses the libusbK driver and the x64 libusbK DLL.
Backend=Auto
; Calibration factors in feed|across order.
Calibration=1|1
Vid=135D
Pid=F001
; Legacy command endpoints, expressed in decimal. -1 selects the first bulk pipe of that direction.
Pipe=1
PipeIn=129
TimeoutMs=2000
; Stroke width for Windows printing, in millimeters.
LineWidthMm=0.4
